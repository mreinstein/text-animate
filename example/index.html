<!doctype html>
<html>
<head>
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width">
  <meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no">


  <style>
    * {
      font-family: monospace;
    }

    body {
      margin: 40px;
    }

    a {
      text-decoration: none;
    }
  </style>

  <noscript>
    <style>* { color: black; }</style>
  </noscript>

</head>
<body>

  <h1 id="michael_reinstein">Michael Reinstein</h1>

  <p> <a href="mailto:reinstein.mike@gmail.com"> [ reinstein.mike@gmail.com ] </a> </p>

  <p> Oakland, CA 94611 </p>

  <h2 id="status">Status</h2>
  <p>Busy running a web development consulting business.</p>


  <h2 id="school">School</h2>
  <ul>
    <li> Attended <a href="#">Plattsburgh State University of New York (SUNY)</a> </li>
    <li> Studied Math, Physics, and Computer Science </li>
  </ul>

<script type="importmap">
{
    "imports": {
        "alea": "https://cdn.skypack.dev/alea",
        "charming": "https://cdn.skypack.dev/charming",
        "clamp": "https://cdn.skypack.dev/clamp",
        "eases": "https://cdn.skypack.dev/eases"
    }
}
</script>

<script type="module">
import animateHeader from '../src/animate-header.js'
import animateText   from '../src/animate-text.js'
import controller    from '../src/controller.js'


const anim = controller()

const seed = Math.random() // enables consistent randomness for this session

const p5 = {
    color: [ 0, 0, 0 ],  // [ r, g, b ]
    duration: 300,
    delay: 200,      // milliseconds to wait before animation starts
    seed
}

const headers = document.querySelectorAll('h1,h2')

for (let i=0; i < headers.length; i++) {
    p5.delay = 120 + Math.floor(50 * Math.random())
    p5.duration = 250 + Math.floor(100 * Math.random())
    anim.add(animateHeader(headers[i], p5))
}

const p3 = {
    etchSpeed: 10 + Math.round(Math.random() * 4), // milliseconds/character
    targetBGColor: 'rgb(255,255,255)',
    targetFGColor: 'rgb(40, 40, 40)',
    etchBGColor:   'rgb(62, 62, 62)',
    etchFGColor:   'rgb(255,20,147)',
    seed
}

const lis = document.querySelectorAll('li,p')
for (let i=0; i < lis.length; i++)
    anim.add(animateText(lis[i], p3))

anim.start()

</script>

</body>
</html>
